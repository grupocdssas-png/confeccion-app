# Configuración de sincronización de PowerSync (Sync Streams, edición 3):
# qué datos baja cada tablet. Se pega en el panel de PowerSync Cloud o se monta
# en el servicio autoalojado. Solo bajan datos; lo que se crea en la tablet sube
# por la RPC ingerir_eventos.
config:
  edition: 3

streams:
  # Maestros comunes a todas las tablets (sin datos sensibles: la nómina no baja).
  maestros_planta:
    auto_subscribe: true
    queries:
      - SELECT clave AS id, CAST(valor AS TEXT) AS valor FROM parametros
      - SELECT codigo AS id, nombre, color_hex, orden FROM procesos
      - SELECT id, codigo, nombre, proceso, turno_id, activo FROM celulas
      - SELECT id, codigo, nombres, apellidos, celula_id, qr, foto_path, activo FROM empleados
      - SELECT id, nombre, CAST(hora_inicio AS TEXT) AS hora_inicio, CAST(hora_fin AS TEXT) AS hora_fin, cruza_medianoche, activo FROM turnos
      - SELECT CAST(fecha AS TEXT) AS id, nombre FROM festivos
      - SELECT id, codigo, orden, activo FROM tallas
      - SELECT id, codigo, nombre, hex, activo FROM colores

  # Lo propio de cada tablet: su registro de dispositivo y su estación.
  mi_estacion:
    auto_subscribe: true
    queries:
      - SELECT id, estacion_id, nombre, tipo FROM dispositivos WHERE usuario_id = auth.user_id() AND activo = true
      - SELECT id, codigo, nombre, tipo, proceso, celula_id, bodega_id, impresora_id FROM estaciones
        WHERE id IN (SELECT estacion_id FROM dispositivos WHERE usuario_id = auth.user_id() AND activo = true)

  # Inventario para bodega, mesas de corte y conteos con el celular (Fase 2).
  # Los rollos agotados dejan de bajar solos.
  inventario:
    auto_subscribe: true
    queries:
      - SELECT id, codigo, tipo, nombre, unidad, maneja_color, activo FROM materiales
      - SELECT id, codigo, nombre, tipo FROM bodegas
      - SELECT id, nombre FROM proveedores
      - SELECT id, bodega_id, codigo, descripcion, activo FROM ubicaciones
      - SELECT id, codigo, material_id, color_id, proveedor_id, lote_tintura, tono, ancho_real_cm, metros_saldo, kilos_saldo,
          bodega_id, ubicacion_id, estado, es_retazo, CAST(fecha_ingreso AS TEXT) AS fecha_ingreso
        FROM rollos WHERE estado != 'agotado'
      - SELECT id, consecutivo, bodega_id, ubicacion_id, alcance, estado FROM conteos_fisicos WHERE estado = 'abierto'
      - SELECT id, nombre, modelo, conexion, CAST(ip AS TEXT) AS ip, puerto FROM impresoras WHERE activo = true
      - SELECT id, tipo, tamano, zpl, version FROM plantillas_etiqueta WHERE activa = true

  # Producción para las tablets de módulo (Fase 6): OP activas, sus operaciones y lo que
  # se puede escanear (paquetes completos y juegos que siguen en planta).
  produccion_planta:
    auto_subscribe: true
    queries:
      - SELECT id, consecutivo, referencia_id, ficha_version_id, estado, proceso_actual, cantidad_total
        FROM ordenes_produccion WHERE estado != 'terminada' AND estado != 'cerrada' AND estado != 'anulada'
      - SELECT id, codigo, nombre FROM referencias
      - SELECT id, codigo, nombre, unidades_marcacion, permite_cambiar_unidades, sin_talla_color FROM operaciones
      - SELECT id, ficha_id, secuencia, operacion_id, proceso, sam, sam_reproceso, repeticiones, es_contadora, unidades_marcacion,
          permite_cambiar_unidades FROM ficha_operaciones
        WHERE ficha_id IN (SELECT ficha_version_id FROM ordenes_produccion WHERE estado != 'terminada' AND estado != 'cerrada' AND estado != 'anulada')
      - SELECT id, ficha_id, codigo, nombre FROM ficha_combinaciones
        WHERE ficha_id IN (SELECT ficha_version_id FROM ordenes_produccion WHERE estado != 'terminada' AND estado != 'cerrada' AND estado != 'anulada')
      - SELECT id, codigo, op_id, color_id, talla_id, lote_tintura, cantidad, cantidad_actual, estado, proceso_actual, celula_id
        FROM paquetes WHERE completo = true AND estado != 'terminado' AND estado != 'anulado'
      - SELECT id, codigo, op_id, combinacion_id, color_id, talla_id, cantidad, cantidad_actual, estado, proceso_actual, celula_id
        FROM juegos WHERE estado != 'terminado' AND estado != 'anulado'
      - SELECT empleado_id || '_' || CAST(fecha AS TEXT) AS id, empleado_id, CAST(fecha AS TEXT) AS fecha, unidades, reprocesos,
          minutos_esperados, minutos_reales FROM eficiencia_diaria

  # Balanceo publicado (Fase 7): la tablet propone a cada operario las operaciones de su puesto.
  balanceo_planta:
    auto_subscribe: true
    queries:
      - SELECT id, op_id, celula_id, version FROM balanceos WHERE estado = 'publicado'
      - SELECT id, balanceo_id, numero, empleado_id FROM balanceo_puestos
        WHERE balanceo_id IN (SELECT id FROM balanceos WHERE estado = 'publicado')
      - SELECT id, balanceo_id, puesto_id, ficha_operacion_id, fraccion FROM balanceo_asignaciones
        WHERE balanceo_id IN (SELECT id FROM balanceos WHERE estado = 'publicado')
