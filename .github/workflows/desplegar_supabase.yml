# Sube a Supabase (la nube) las migraciones de la base de datos y la Edge Function
# de integraciones. Se ejecuta a mano: Actions → "Desplegar en Supabase" → Run workflow.
#
# Configuración (una vez): Settings → Secrets and variables → Actions → New repository secret
#   SUPABASE_ACCESS_TOKEN   token personal de supabase.com (Account → Access Tokens)
#   SUPABASE_PROJECT_REF    el "Reference ID" del proyecto (Project Settings → General)
#   SUPABASE_DB_PASSWORD    la contraseña de la base de datos del proyecto
# Las claves de Alegra y WhatsApp NO van aquí: van en Supabase → Edge Functions → Secrets.
name: Desplegar en Supabase

on:
  workflow_dispatch:
    inputs:
      migraciones:
        description: 'Aplicar también las migraciones de la base de datos'
        type: boolean
        default: true

jobs:
  desplegar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Enlazar el proyecto
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} -p "$SUPABASE_DB_PASSWORD"
      - name: Migraciones
        if: ${{ inputs.migraciones }}
        run: supabase db push -p "$SUPABASE_DB_PASSWORD"
      - name: Edge Function de integraciones
        run: supabase functions deploy integraciones --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
