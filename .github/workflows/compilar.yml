# Compila y prueba la app en GitHub cada vez que se sube código (no hace falta VS Code).
# El APK y el panel web quedan para descargar en la pestaña "Actions" → la ejecución → "Artifacts".
#
# Configuración (una vez): Settings → Secrets and variables → Actions → New repository secret
#   SUPABASE_URL, SUPABASE_ANON_KEY, POWERSYNC_URL   (las tres son públicas; las claves secretas NUNCA van aquí)
name: Compilar y probar

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  pruebas-base:
    name: Reglas en PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Cliente de PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y postgresql-client jq
      - name: Migraciones, datos de ejemplo y pruebas
        run: |
          herramientas/probar_bd.sh | tee salida.txt
          ! grep -qE "ERROR|FALLÓ" salida.txt

  integraciones:
    name: Integraciones (Alegra y WhatsApp simulados)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Pruebas de la Edge Function
        run: deno test supabase/functions/_compartido/
      - name: Compila la Edge Function
        run: deno check supabase/functions/integraciones/index.ts

  app:
    name: Pruebas, APK y panel web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Configuración
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          POWERSYNC_URL: ${{ secrets.POWERSYNC_URL }}
        run: |
          jq -n --arg u "${SUPABASE_URL:-https://configurar.supabase.co}" --arg a "${SUPABASE_ANON_KEY:-configurar}" \
                --arg p "${POWERSYNC_URL:-https://configurar.powersync.journeyapps.com}" \
                '{SUPABASE_URL: $u, SUPABASE_ANON_KEY: $a, POWERSYNC_URL: $p}' > config/ci.json
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Pruebas de la app
        run: flutter test
      - name: APK de las tablets
        run: flutter build apk --release -t lib/main_planta.dart --dart-define-from-file=config/ci.json
      - name: Panel web
        run: flutter build web --release -t lib/main_web.dart --no-web-resources-cdn --dart-define-from-file=config/ci.json -o build/web_oficina
      - uses: actions/upload-artifact@v4
        with:
          name: apk-tablets
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: panel-web
          path: app/build/web_oficina
          retention-days: 30
