name: confeccion
description: "Gestión y trazabilidad de confección: planta (Android) y oficina (web)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  barcode_widget: ^2.0.4
  drift: ^2.35.3
  drift_sqlite_async: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2
  http: ^1.6.0
  intl: ^0.20.3
  mobile_scanner: ^7.5.0
  path_provider: ^2.1.6
  pdf: ^3.13.1
  powersync: ^2.6.0
  printing: ^5.15.1
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  drift_dev: ^2.35.2
  supabase: ^2.16.5

flutter:
  uses-material-design: true
  assets:
    - assets/fuentes/
  fonts:
    - family: IBMPlexSans
      fonts:
        - asset: assets/fuentes/IBMPlexSans-Regular.ttf
        - asset: assets/fuentes/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fuentes/IBMPlexSans-Bold.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fuentes/IBMPlexMono-Regular.ttf
        - asset: assets/fuentes/IBMPlexMono-SemiBold.ttf
          weight: 600
